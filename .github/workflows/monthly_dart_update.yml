name: Monthly DART update and GitHub Pages
on:
  schedule:
    - cron: '10 16 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dart-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY || secrets.DART_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate API secret
        run: python -c "import os; k=os.getenv('OPENDART_API_KEY','').strip(); assert k, 'OPENDART_API_KEY is not configured.'; assert len(k)==40, f'Expected a 40-character OpenDART key; got {len(k)}.'; print('OpenDART API key is present.')"
      - name: Collect and analyze
        run: python src/pipeline.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update Samsung DART financial data"
            git push
          fi
      - name: Prepare Pages artifact
        run: |
          rm -rf docs/data
          mkdir -p docs/data
          cp data/metrics.json data/financials.csv data/filings.json data/last_update.txt docs/data/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
